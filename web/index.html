<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>versecam</title>
<style>
  :root {
    --bg: #05060d;
    --bg2: #0a0d1a;
    --panel: #0b1020;
    --panel2: #101a30;
    --line: #1d2b4d;
    --text: #c8d6f0;
    --muted: #5f7099;
    --cyan: #00f0ff;
    --magenta: #ff2bd6;
    --lime: #a6ff2b;
    --amber: #ffb300;
    --red: #ff3355;
  }
  * { box-sizing: border-box; }

  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 13px/1.55 "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
    letter-spacing: .3px;
  }
  /* Rejilla y scanlines: puro decorado, no intercepta clicks. */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 9;
    background:
      linear-gradient(rgba(0,240,255,.025) 1px, transparent 1px) 0 0 / 100% 3px,
      radial-gradient(ellipse at 50% 0%, rgba(255,43,214,.07), transparent 60%);
  }

  header {
    position: relative; z-index: 10;
    display: flex; align-items: center; gap: 18px;
    padding: 11px 18px; background: var(--panel);
    border-bottom: 1px solid var(--cyan);
    box-shadow: 0 0 22px rgba(0,240,255,.16);
  }
  header h1 {
    font-size: 15px; margin: 0; font-weight: 700; letter-spacing: 3px;
    color: var(--cyan); text-shadow: 0 0 10px rgba(0,240,255,.65);
  }
  header h1 span { color: var(--magenta); text-shadow: 0 0 10px rgba(255,43,214,.65); }
  .spacer { flex: 1; }
  .muted { color: var(--muted); }

  button {
    background: transparent; color: var(--cyan); border: 1px solid var(--line);
    border-radius: 2px; padding: 4px 11px; cursor: pointer;
    font: inherit; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
    transition: all .15s;
  }
  button:hover:not(:disabled) {
    border-color: var(--cyan); box-shadow: 0 0 12px rgba(0,240,255,.35); color: #fff;
  }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { border-color: var(--magenta); color: var(--magenta); }
  button.primary:hover { box-shadow: 0 0 14px rgba(255,43,214,.5); color: #fff; }
  button.danger { border-color: #4a1424; color: var(--red); }
  button.danger:hover { border-color: var(--red); box-shadow: 0 0 12px rgba(255,51,85,.4); }

  .layout { display: grid; grid-template-columns: 380px 1fr; height: calc(100vh - 46px); }
  .sidebar { border-right: 1px solid var(--line); overflow-y: auto; background: var(--bg2); }
  .main { overflow-y: auto; padding: 18px; position: relative; z-index: 10; }

  .sec-label {
    padding: 8px 12px 4px; font-size: 10px; letter-spacing: 2px;
    color: var(--muted); text-transform: uppercase; border-bottom: 1px solid var(--line);
  }

  .worker {
    padding: 11px 12px; border-bottom: 1px solid var(--line);
    cursor: pointer; position: relative; transition: background .15s;
    overflow: hidden;
  }
  .worker .ticket, .worker .desc, .ext { overflow-wrap: anywhere; }
  .worker::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: transparent;
  }
  .worker:hover { background: var(--panel2); }
  .worker.active { background: var(--panel2); }
  .worker.active::before { background: var(--cyan); box-shadow: 0 0 12px var(--cyan); }
  .worker.principal .ticket { color: var(--magenta); text-shadow: 0 0 8px rgba(255,43,214,.5); }
  .worker.busy { background: rgba(0,240,255,.05); }
  .worker.busy::before { background: var(--lime); box-shadow: 0 0 12px var(--lime); animation: pulse 1.1s ease-in-out infinite; }

  .worker .ticket { font-weight: 700; color: #e8f2ff; letter-spacing: 1px; }
  .worker .desc { color: var(--muted); font-size: 11px; margin: 1px 0 6px; }
  .worker .meta { display: flex; gap: 9px; font-size: 10px; color: var(--muted); flex-wrap: wrap; }

  /* Etiqueta de tarea en curso: lo que el agente esta haciendo AHORA. */
  .task-chip {
    margin-top: 7px; padding: 5px 8px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(166,255,43,.12), transparent);
    border-left: 2px solid var(--lime);
    font-size: 11px; color: #d8ffb0;
    display: flex; gap: 7px; align-items: flex-start;
  }
  .task-chip.waiting {
    background: linear-gradient(90deg, rgba(255,179,0,.12), transparent);
    border-left-color: var(--amber); color: #ffdf9e;
  }
  .task-chip .txt {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis;
    overflow-wrap: anywhere;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .task-chip .act { font-size: 10px; color: var(--lime); white-space: nowrap; letter-spacing: 1px; }

  .blip {
    width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; margin-top: 5px;
    background: var(--lime); box-shadow: 0 0 8px var(--lime); animation: pulse 1.1s ease-in-out infinite;
  }
  .blip.waiting { background: var(--amber); box-shadow: 0 0 8px var(--amber); animation: none; }
  @keyframes pulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.75); } }

  .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; }
  .dot.working { background: var(--lime); box-shadow: 0 0 8px var(--lime); animation: pulse 1.1s ease-in-out infinite; }
  .dot.waiting { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
  .dot.stopped { background: #2a3450; }

  .ext {
    margin-top: 6px; font-size: 10px; color: var(--magenta);
    border-left: 2px solid var(--magenta); padding-left: 7px;
  }

  .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); margin-bottom: 16px; }
  .tabs button { border: none; border-bottom: 2px solid transparent; border-radius: 0; padding: 7px 14px; }
  .tabs button.active {
    border-bottom-color: var(--magenta); color: var(--magenta);
    text-shadow: 0 0 9px rgba(255,43,214,.6);
  }

  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { text-align: left; padding: 6px 9px; border-bottom: 1px solid var(--line); }
  th { color: var(--cyan); font-weight: 500; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }

  pre.term {
    background: #02030a; border: 1px solid var(--line); border-radius: 2px;
    padding: 12px; height: 52vh; overflow: auto; margin: 0;
    white-space: pre-wrap; word-break: break-word; font-size: 12px; color: #9fd8e8;
    box-shadow: inset 0 0 40px rgba(0,240,255,.05);
  }
  textarea, input {
    width: 100%; background: #02030a; color: var(--text); border: 1px solid var(--line);
    border-radius: 2px; padding: 8px; font: inherit; resize: vertical;
  }
  textarea { min-height: 62px; }
  textarea:focus, input:focus { outline: none; border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,240,255,.25); }

  .row { display: flex; gap: 8px; align-items: center; margin: 11px 0; flex-wrap: wrap; }
  .card {
    background: var(--panel); border: 1px solid var(--line); border-radius: 2px;
    padding: 13px; margin-bottom: 14px;
  }
  .card h3 {
    margin: 0 0 11px; font-size: 10px; color: var(--cyan);
    text-transform: uppercase; letter-spacing: 2px;
  }
  .tag {
    padding: 1px 7px; border-radius: 2px; border: 1px solid var(--line);
    font-size: 10px; letter-spacing: .8px;
  }
  .tag.ok { color: var(--lime); border-color: #2c4a12; }
  .tag.warn { color: var(--amber); border-color: #4a3a12; }
  .tag.bad { color: var(--red); border-color: #4a1424; }
  a { color: var(--cyan); }
  .empty { color: var(--muted); padding: 40px; text-align: center; letter-spacing: 2px; }
  #toast {
    position: fixed; bottom: 18px; right: 18px; background: var(--panel2);
    border: 1px solid var(--cyan); border-left: 3px solid var(--cyan);
    box-shadow: 0 0 20px rgba(0,240,255,.25);
    padding: 10px 15px; border-radius: 2px; display: none; max-width: 440px; z-index: 20;
  }
  button.toggle.on {
    border-color: var(--lime); color: var(--lime);
    box-shadow: 0 0 12px rgba(166,255,43,.35);
  }
  button.rec {
    border-color: var(--red); color: var(--red);
    animation: recpulse 1s ease-in-out infinite;
  }
  @keyframes recpulse {
    0%,100% { box-shadow: 0 0 4px rgba(255,51,85,.4); }
    50% { box-shadow: 0 0 16px rgba(255,51,85,.9); }
  }
  .banner {
    padding: 9px 12px; margin-bottom: 14px; border: 1px solid var(--magenta);
    border-radius: 2px; background: rgba(255,43,214,.07); font-size: 11px;
  }
</style>
</head>
<body>

<header>
  <h1>VERSECAM<span>//</span>PANEL</h1>
  <span class="muted" id="summary">iniciando...</span>
  <span class="spacer"></span>
  <button id="tg-mic" class="toggle" title="Dictar mensajes con la voz (whisper local)">Dictado</button>
  <button id="tg-voz" class="toggle" title="Leer en voz alta la respuesta del agente (kokoro local)">Voz</button>
  <button id="btn-jira">Jira</button>
  <button id="btn-refresh">Refrescar</button>
</header>

<div class="layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="main" id="main"><div class="empty">SELECCIONA UN CONTEXTO</div></div>
</div>

<div id="toast"></div>

<script>
const state = {
  workers: [], externals: [], selected: null, tab: "agent", detail: null,
  stream: null, streamID: null, streamOK: false
};

function toast(msg, bad) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.style.borderColor = bad ? "var(--red)" : "var(--cyan)";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.display = "none"; }, 4000);
}

// --- ANSI a HTML -----------------------------------------------------------
// El pane se captura con codigos SGR. Renderizarlos aqui evita meter una
// dependencia de terminal completa para lo unico que hacia falta: color.
const ANSI16 = [
  "#3b4763", "#ff3355", "#a6ff2b", "#ffb300", "#3d9bff", "#ff2bd6", "#00f0ff", "#c8d6f0",
  "#5f7099", "#ff6b81", "#ccff7a", "#ffd166", "#7ab8ff", "#ff7ae6", "#7af5ff", "#ffffff"
];

function ansiColor(code) {
  if (code < 16) return ANSI16[code];
  if (code < 232) {
    const n = code - 16;
    const level = v => [0, 95, 135, 175, 215, 255][v];
    return `rgb(${level(Math.floor(n / 36))},${level(Math.floor(n / 6) % 6)},${level(n % 6)})`;
  }
  const gray = 8 + (code - 232) * 10;
  return `rgb(${gray},${gray},${gray})`;
}

function ansiToHtml(text) {
  if (!text) return "";
  let style = { fg: null, bg: null, bold: false, dim: false, italic: false, underline: false, inverse: false };
  let html = "", buffer = "";

  const flush = () => {
    if (!buffer) return;
    const body = esc(buffer);
    const css = [];
    let fg = style.fg, bg = style.bg;
    if (style.inverse) { const t = fg; fg = bg || "#05060d"; bg = t || "#c8d6f0"; }
    if (fg) css.push("color:" + fg);
    if (bg) css.push("background:" + bg);
    if (style.bold) css.push("font-weight:700");
    if (style.dim) css.push("opacity:.6");
    if (style.italic) css.push("font-style:italic");
    if (style.underline) css.push("text-decoration:underline");
    html += css.length ? `<span style="${css.join(";")}">${body}</span>` : body;
    buffer = "";
  };

  for (let i = 0; i < text.length; i++) {
    if (text[i] !== "\x1b") { buffer += text[i]; continue; }

    const rest = text.slice(i);
    const sgr = /^\x1b\[([0-9;]*)m/.exec(rest);
    if (!sgr) {
      // Cualquier otra secuencia de escape se descarta: solo interesa color.
      const other = /^\x1b(\][^\x07\x1b]*(\x07|\x1b\\)|[@-Z\\-_]|\[[0-?]*[ -\/]*[@-~])/.exec(rest);
      i += other ? other[0].length - 1 : 1;
      continue;
    }
    flush();
    i += sgr[0].length - 1;

    const codes = sgr[1] === "" ? [0] : sgr[1].split(";").map(Number);
    for (let k = 0; k < codes.length; k++) {
      const c = codes[k];
      if (c === 0) style = { fg: null, bg: null, bold: false, dim: false, italic: false, underline: false, inverse: false };
      else if (c === 1) style.bold = true;
      else if (c === 2) style.dim = true;
      else if (c === 3) style.italic = true;
      else if (c === 4) style.underline = true;
      else if (c === 7) style.inverse = true;
      else if (c === 22) { style.bold = false; style.dim = false; }
      else if (c === 23) style.italic = false;
      else if (c === 24) style.underline = false;
      else if (c === 27) style.inverse = false;
      else if (c === 39) style.fg = null;
      else if (c === 49) style.bg = null;
      else if (c >= 30 && c <= 37) style.fg = ANSI16[c - 30];
      else if (c >= 40 && c <= 47) style.bg = ANSI16[c - 40];
      else if (c >= 90 && c <= 97) style.fg = ANSI16[c - 90 + 8];
      else if (c >= 100 && c <= 107) style.bg = ANSI16[c - 100 + 8];
      else if (c === 38 || c === 48) {
        const target = c === 38 ? "fg" : "bg";
        if (codes[k + 1] === 5) { style[target] = ansiColor(codes[k + 2]); k += 2; }
        else if (codes[k + 1] === 2) { style[target] = `rgb(${codes[k + 2]},${codes[k + 3]},${codes[k + 4]})`; k += 4; }
      }
    }
  }
  flush();
  return html;
}

async function api(path, options) {
  const res = await fetch(path, options);
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

function post(path, body) {
  return api(path, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body || {})
  });
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function humanTime(sec) {
  if (!sec || sec < 0) return "-";
  if (sec < 60) return sec + "s";
  if (sec < 3600) return Math.floor(sec / 60) + "m";
  return Math.floor(sec / 3600) + "h" + Math.floor((sec % 3600) / 60) + "m";
}

async function loadWorkers() {
  const data = await api("/api/workers");
  state.workers = data.workers || [];
  state.externals = data.externals || [];

  const own = state.workers.filter(w => w.agent.running);
  const busy = own.filter(w => w.agent.status === "working").length;
  const ext = state.workers.reduce((n, w) => n + (w.externals || []).length, 0) + state.externals.length;
  document.getElementById("summary").textContent =
    `${state.workers.length} contextos | ${own.length} agentes del panel (${busy} trabajando) | ${ext} externos`;
  renderSidebar();
}

// La etiqueta de tarea es el punto del pedido: de un vistazo, que worktree
// tiene agente y en que esta.
function taskChip(agent) {
  if (!agent.running) return "";
  const working = agent.status === "working";
  const text = agent.task || "sin tarea enviada";
  const act = working
    ? (agent.activity || "trabajando") + (agent.elapsed_sec ? " " + agent.elapsed_sec + "s" : "")
    : "en espera";
  return `
    <div class="task-chip ${working ? "" : "waiting"}">
      <span class="blip ${working ? "" : "waiting"}"></span>
      <span class="txt">${esc(text)}</span>
      <span class="act">${esc(act)}</span>
    </div>`;
}

function workerRow(w) {
  const busy = w.agent.status === "working";
  const externals = w.externals || [];
  return `
    <div class="worker ${w.id === state.selected ? "active" : ""} ${busy ? "busy" : ""} ${w.is_principal ? "principal" : ""}"
         data-id="${esc(w.id)}">
      <div class="ticket">${esc(w.ticket)}</div>
      <div class="desc">${esc(w.description)}</div>
      <div class="meta">
        <span><span class="dot ${w.agent.status}"></span>${esc(w.agent.status)}</span>
        ${w.port_base ? `<span>:${w.port_base}</span>` : ""}
        <span>svc ${w.services_up}/${w.services_all}</span>
        <span>${w.db_ready ? "db ok" : "db falta"}</span>
      </div>
      ${taskChip(w.agent)}
      ${externals.length ? `<div class="ext">${externals.length} agente(s) externo(s): pid ${externals.map(e => e.pid).join(", ")}</div>` : ""}
    </div>`;
}

function renderSidebar() {
  const principal = state.workers.filter(w => w.is_principal);
  const rest = state.workers.filter(w => !w.is_principal);

  document.getElementById("sidebar").innerHTML =
    `<div class="sec-label">Workspace principal</div>` +
    principal.map(workerRow).join("") +
    `<div class="sec-label">Worktrees (${rest.length})</div>` +
    rest.map(workerRow).join("") +
    (state.externals.length ? `
      <div class="sec-label">Agentes fuera del workspace</div>
      ${state.externals.map(e => `
        <div class="worker" style="cursor:default">
          <div class="ticket" style="color:var(--magenta)">${esc(e.label)}</div>
          <div class="desc">${esc(e.cwd)}</div>
          <div class="meta"><span>pid ${e.pid}</span><span>${humanTime(e.uptime_sec)}</span></div>
        </div>`).join("")}` : "");

  document.querySelectorAll(".worker[data-id]").forEach(el => {
    el.onclick = () => select(el.dataset.id);
  });
}

function select(id) {
  if (state.selected !== id) closeStream();
  state.selected = id;
  renderSidebar();
  refreshDetail();
}

async function refreshDetail(refreshPRs) {
  if (!state.selected) return;
  const url = "/api/workers/" + encodeURIComponent(state.selected) + (refreshPRs ? "?refresh_prs=1" : "");
  state.detail = await api(url);
  renderMain();
}

function renderMain() {
  const d = state.detail;
  if (!d) return;
  document.getElementById("main").innerHTML = `
    <div class="row">
      <strong style="font-size:16px;color:${d.is_principal ? "var(--magenta)" : "var(--cyan)"};letter-spacing:2px">${esc(d.ticket)}</strong>
      <span class="muted">${esc(d.description)}</span>
    </div>
    <div class="row muted" style="font-size:10px">
      ${esc(d.root)} ${d.port_base ? `| puertos ${d.port_base}+ (php ${d.php_port})` : ""}
      ${d.db_name ? `| db ${esc(d.db_name)} <span class="tag ${d.db_ready ? "ok" : "bad"}">${d.db_ready ? "ok" : "ausente"}</span>` : "| db compartida"}
    </div>
    ${(d.externals || []).length ? `<div class="banner">
      Hay ${d.externals.length} agente(s) de Claude corriendo aqui que no lanzo el panel
      (pid ${d.externals.map(e => e.pid).join(", ")}). El panel no los controla, pero tocan estos mismos repos.
    </div>` : ""}
    <div class="tabs">
      <button data-tab="agent" class="${state.tab === "agent" ? "active" : ""}">Agente</button>
      <button data-tab="services" class="${state.tab === "services" ? "active" : ""}">Servicios ${d.services_up}/${d.services_all}</button>
      <button data-tab="git" class="${state.tab === "git" ? "active" : ""}">Git y PRs ${d.repos.length}</button>
    </div>
    <div id="tabbody"></div>`;

  document.querySelectorAll(".tabs button").forEach(b => {
    b.onclick = () => {
      state.tab = b.dataset.tab;
      if (state.tab !== "agent") closeStream();
      renderMain();
    };
  });

  if (state.tab === "agent") renderAgentTab();
  if (state.tab === "services") renderServicesTab();
  if (state.tab === "git") renderGitTab();
}

function renderAgentTab() {
  const d = state.detail, a = d.agent, running = a.running;
  document.getElementById("tabbody").innerHTML = `
    <div class="row">
      <span class="dot ${a.status}" id="a-status"></span>
      <strong style="letter-spacing:1.5px" id="a-status-text">${esc(a.status).toUpperCase()}</strong>
      <span class="muted">uptime ${humanTime(a.uptime_sec)} | pid ${esc(a.pid) || "-"}</span>
      <span class="spacer"></span>
      ${running
        ? `<button id="a-int">Interrumpir</button><button id="a-stop" class="danger">Detener</button>`
        : `<button id="a-start" class="primary">Lanzar agente</button>`}
    </div>
    ${running ? `<div class="card"><h3>Tarea en curso</h3><div id="a-taskchip">${taskChip(a)}</div></div>` : `
      <div class="card">
        <h3>Lanzar</h3>
        <textarea id="a-prompt" placeholder="Prompt inicial (opcional). Ej: lee context/BITACORA.md y continua donde quedo."></textarea>
        <div class="row"><input id="a-flags" placeholder="flags de claude (opcional)"></div>
      </div>`}
    <pre class="term" id="a-out">${running ? "cargando salida..." : "agente detenido"}</pre>
    ${running ? `
      <div class="card" style="margin-top:14px">
        <h3>Enviar mensaje</h3>
        <textarea id="a-msg" placeholder="Escribe y Ctrl+Enter para enviar"></textarea>
        <div class="row">
          <button id="a-send" class="primary">Enviar</button>
          <button id="a-mic" hidden>Dictar</button>
          <button id="a-read" hidden>Leer respuesta</button>
          <span class="muted" style="font-size:10px">control real: tmux attach -t ${esc(a.session)}</span>
        </div>
      </div>
      <div class="card">
        <h3>Teclas</h3>
        <div class="row">
          ${["Enter", "Escape", "Space", "Tab", "Up", "Down", "Left", "Right"]
            .map(k => `<button data-key="${k}">${k}</button>`).join("")}
        </div>
      </div>` : ""}`;

  const start = document.getElementById("a-start");
  if (start) start.onclick = async () => {
    try {
      await post(`/api/workers/${encodeURIComponent(d.id)}/agent/start`, {
        prompt: document.getElementById("a-prompt").value,
        flags: document.getElementById("a-flags").value
      });
      toast("Agente lanzado");
      await loadWorkers(); await refreshDetail();
    } catch (e) { toast(e.message, true); }
  };

  bindAction("a-stop", "/agent/stop", "Agente detenido");
  bindAction("a-int", "/agent/interrupt", "Interrumpido");

  const send = document.getElementById("a-send");
  if (send) {
    const box = document.getElementById("a-msg");
    const doSend = async () => {
      if (!box.value.trim()) return;
      try {
        await post(`/api/workers/${encodeURIComponent(d.id)}/agent/send`, { text: box.value });
        box.value = "";
        toast("Enviado");
      } catch (e) { toast(e.message, true); }
    };
    send.onclick = doSend;
    box.onkeydown = e => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) doSend(); };
  }

  const leer = document.getElementById("a-read");
  if (leer) {
    leer.hidden = !(voice.tts && voice.available);
    leer.onclick = () => {
      if (!voice.lastReply) { toast("todavia no hay respuesta que leer", true); return; }
      speak(voice.lastReply);
    };
  }

  const mic = document.getElementById("a-mic");
  if (mic) {
    mic.hidden = !(voice.mic && voice.available);
    mic.onclick = async () => {
      try {
        if (voice.recorder) voice.recorder.stop();
        else await startRecording(mic);
      } catch (e) { toast("no se pudo usar el microfono: " + e.message, true); }
    };
  }

  document.querySelectorAll("[data-key]").forEach(b => {
    b.onclick = async () => {
      try {
        await post(`/api/workers/${encodeURIComponent(d.id)}/agent/key`, { key: b.dataset.key });
        setTimeout(pollAgentOutput, 400);
      } catch (e) { toast(e.message, true); }
    };
  });

  if (running) {
    openStream(d.id);
    pollAgentOutput();
  } else {
    closeStream();
  }
}

function bindAction(elementID, suffix, okMsg) {
  const el = document.getElementById(elementID);
  if (!el) return;
  el.onclick = async () => {
    try {
      await post(`/api/workers/${encodeURIComponent(state.detail.id)}${suffix}`);
      toast(okMsg);
      await loadWorkers(); await refreshDetail();
    } catch (e) { toast(e.message, true); }
  };
}

function paintOutput(text, colored) {
  const out = document.getElementById("a-out");
  if (!out) return;
  const atBottom = out.scrollHeight - out.scrollTop - out.clientHeight < 40;
  if (colored) out.innerHTML = ansiToHtml(text) || "(sin salida)";
  else out.textContent = text || "(sin salida)";
  if (atBottom) out.scrollTop = out.scrollHeight;
}

// Al llegar un frame se actualizan solo los nodos que cambian. Un re-render
// completo borraria lo que el usuario esta escribiendo en el textarea.
function paintAgentState(agent) {
  if (!state.detail) return;
  state.detail.agent = Object.assign({}, state.detail.agent, agent);

  const status = document.getElementById("a-status");
  if (status) {
    status.className = "dot " + agent.status;
    const label = document.getElementById("a-status-text");
    if (label) label.textContent = agent.status.toUpperCase();
  }
  const chip = document.getElementById("a-taskchip");
  if (chip) chip.innerHTML = taskChip(agent);
}

function closeStream() {
  if (state.stream) { state.stream.close(); state.stream = null; }
  state.streamID = null;
  state.streamOK = false;
}

function openStream(id) {
  if (state.streamID === id && state.stream) return;
  closeStream();
  state.streamID = id;

  const es = new EventSource(`/api/workers/${encodeURIComponent(id)}/agent/stream`);
  state.stream = es;

  es.onmessage = event => {
    state.streamOK = true;
    let frame;
    try { frame = JSON.parse(event.data); } catch (e) { return; }
    if (state.selected !== id || state.tab !== "agent") return;
    if (frame.output !== undefined && frame.output !== "") paintOutput(frame.output, true);
    if (frame.state) paintAgentState(frame.state);
    if (frame.reply) { voice.lastReply = frame.reply; speak(frame.reply); }
  };

  es.onerror = () => {
    // Si el navegador no puede mantener el stream se cae a polling.
    state.streamOK = false;
  };
}

async function pollAgentOutput() {
  if (state.tab !== "agent" || !state.selected || state.streamOK) return;
  try {
    const data = await api(`/api/workers/${encodeURIComponent(state.selected)}/agent?lines=300`);
    paintOutput(data.output, false);
    if (data.state) paintAgentState(data.state);
  } catch (e) { /* el panel sigue vivo aunque falle un poll */ }
}

function renderServicesTab() {
  const d = state.detail;
  document.getElementById("tabbody").innerHTML = `
    <table>
      <tr><th>Servicio</th><th>Descripcion</th><th>Estado</th><th>PID</th><th></th></tr>
      ${d.services.map(s => `
        <tr>
          <td><strong>${esc(s.name)}</strong></td>
          <td class="muted">${esc(s.desc)}</td>
          <td><span class="tag ${s.running ? "ok" : ""}">${s.running ? "up" : "down"}</span></td>
          <td class="muted">${esc(s.pid) || "-"}</td>
          <td>
            <button data-svc="${esc(s.name)}" data-act="${s.running ? "restart" : "start"}">${s.running ? "restart" : "start"}</button>
            ${s.running ? `<button data-svc="${esc(s.name)}" data-act="stop" class="danger">stop</button>` : ""}
            <button data-svc="${esc(s.name)}" data-act="logs">logs</button>
          </td>
        </tr>`).join("")}
    </table>
    <pre class="term" id="svc-out" style="height:34vh;margin-top:14px">selecciona logs de un servicio</pre>`;

  document.querySelectorAll("[data-svc]").forEach(b => {
    b.onclick = async () => {
      const svc = b.dataset.svc, act = b.dataset.act;
      const base = `/api/workers/${encodeURIComponent(d.id)}/services/${encodeURIComponent(svc)}`;
      try {
        if (act === "logs") {

          document.getElementById("svc-out").innerHTML = ansiToHtml(data.output) || "(sin salida)";
          return;
        }
        b.disabled = true;
        await post(base + "/" + act);
        toast(act + " " + svc);
        await loadWorkers(); await refreshDetail();
      } catch (e) { toast(e.message, true); b.disabled = false; }

}

function renderGitTab() {
  const d = state.detail;
  document.getElementById("tabbody").innerHTML = `
    <div class="card">
      <h3>Repos</h3>
      <table>
        <tr><th>Repo</th><th>Rama</th><th>Sin commit</th><th>Sin push</th></tr>
        ${d.repos.map(r => `
          <tr>
            <td><strong>${esc(r.name)}</strong></td>

            <td>${r.dirty > 0 ? `<span class="tag warn">${r.dirty}</span>` : `<span class="tag ok">limpio</span>`}</td>
            <td>${r.error ? `<span class="tag bad">${esc(r.error)}</span>`
                  : r.ahead > 0 ? `<span class="tag warn">${r.ahead} commits</span>`
                  : r.has_remote ? `<span class="tag ok">al dia</span>`
                  : `<span class="tag">sin remoto</span>`}</td>
          </tr>`).join("")}
      </table>
    </div>
    <div class="card">
      <h3>Pull requests <button id="pr-refresh" style="float:right">refrescar</button></h3>

          <tr><th>Repo</th><th>PR</th><th>Titulo</th><th>Estado</th><th>Checks</th></tr>
          ${d.prs.map(p => `
            <tr>
              <td>${esc(p.repo)}</td>
              <td><a href="${esc(p.url)}" target="_blank">#${p.number}</a></td>
              <td>${esc(p.title)}</td>
              <td><span class="tag ${p.state === "MERGED" ? "ok" : p.state === "CLOSED" ? "bad" : ""}">${esc(p.state)}</span></td>
              <td><span class="tag ${p.checks === "verde" ? "ok" : p.checks.includes("fallando") ? "bad" : "warn"}">${esc(p.checks)}</span></td>
            </tr>`).join("")}

// --- Voz -------------------------------------------------------------------
// Dos funciones independientes: dictar (whisper) y escuchar (kokoro). Cada
// una se prende por separado y se recuerda entre recargas.
const voice = {
  available: false,
  mic: localStorage.getItem("panel.mic") === "1",
  tts: localStorage.getItem("panel.tts") === "1",
  recorder: null, chunks: [], player: null, lastReply: ""
};

function paintVoiceToggles() {
  const mic = document.getElementById("tg-mic");
  const tts = document.getElementById("tg-voz");
  mic.classList.toggle("on", voice.mic && voice.available);
  tts.classList.toggle("on", voice.tts && voice.available);
  mic.disabled = !voice.available;
  tts.disabled = !voice.available;
  if (!voice.available) {
    mic.title = tts.title = "sidecar de voz apagado: vel start voice";
  }
  // El boton de dictar siempre se pinta en el formulario y solo se muestra
  // segun el toggle: asi no depende de que el detalle se vuelva a renderizar.
  const dictar = document.getElementById("a-mic");
  if (dictar) dictar.hidden = !(voice.mic && voice.available);
  const leer = document.getElementById("a-read");
  if (leer) leer.hidden = !(voice.tts && voice.available);
}

async function loadVoice() {
  try {
    const health = await api("/api/voice");
    voice.available = !!health.available;
  } catch (e) { voice.available = false; }
  paintVoiceToggles();
}

document.getElementById("tg-mic").onclick = () => {
  voice.mic = !voice.mic;
  localStorage.setItem("panel.mic", voice.mic ? "1" : "0");
  paintVoiceToggles();
  if (state.tab === "agent") renderMain();
};

document.getElementById("tg-voz").onclick = () => {
  voice.tts = !voice.tts;
  localStorage.setItem("panel.tts", voice.tts ? "1" : "0");
  paintVoiceToggles();
  if (!voice.tts && voice.player) { voice.player.pause(); voice.player = null; }
};

async function startRecording(button) {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  voice.chunks = [];
  const recorder = new MediaRecorder(stream);
  voice.recorder = recorder;

  recorder.ondataavailable = e => { if (e.data.size) voice.chunks.push(e.data); };
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    button.classList.remove("rec");
    button.textContent = "Transcribiendo...";
    button.disabled = true;
    try {
      const blob = new Blob(voice.chunks, { type: recorder.mimeType });
      const res = await fetch("/api/voice/stt", { method: "POST", body: blob });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "fallo la transcripcion");
      const box = document.getElementById("a-msg");
      if (box && data.text) {
        box.value = box.value ? box.value + " " + data.text : data.text;
        box.focus();
      }
      if (!data.text) toast("no se entendio nada", true);
    } catch (e) { toast(e.message, true); }
    button.disabled = false;
    button.textContent = "Dictar";
    voice.recorder = null;
  };

  recorder.start();
  button.classList.add("rec");
  button.textContent = "Grabando... parar";
}

async function speak(text) {
  if (!voice.tts || !voice.available || !text) return;
  try {
    const res = await fetch("/api/voice/tts", { method: "POST", body: text });
    if (!res.ok) return;
    const blob = await res.blob();
    if (voice.player) voice.player.pause();
    voice.player = new Audio(URL.createObjectURL(blob));
    voice.player.play().catch(() => {
      // Chrome exige un gesto del usuario antes del primer audio.
      toast("el navegador bloqueo el audio: usa el boton Leer una vez", true);
    });
  } catch (e) { /* la voz nunca debe romper el panel */ }
}

document.getElementById("btn-jira").onclick = async () => {
  state.selected = null; renderSidebar();
  const main = document.getElementById("main");
  main.innerHTML = `<div class="empty">CONSULTANDO JIRA...</div>`;
  try {
    const issues = await api("/api/jira?refresh=1");
    main.innerHTML = `
      <div class="card">
        <h3>Tickets LOG asignados sin cerrar</h3>
        <table>
          <tr><th>Ticket</th><th>Resumen</th><th>Estado</th><th>Prioridad</th><th>Worker</th></tr>
          ${issues.map(i => `
            <tr>
              <td><a href="${esc(i.url)}" target="_blank">${esc(i.key)}</a></td>
              <td>${esc(i.summary)}</td>
              <td class="muted">${esc(i.status)}</td>
              <td class="muted">${esc(i.priority)}</td>
              <td>${i.has_worker ? `<span class="tag ok">creado</span>` : `<span class="muted">/wt-new ${esc(i.key)}</span>`}</td>
            </tr>`).join("")}
        </table>
      </div>`;
  } catch (e) {
    main.innerHTML = `<div class="empty">JIRA NO RESPONDIO: ${esc(e.message)}</div>`;

};

document.getElementById("btn-refresh").onclick = async () => {
  await loadWorkers();
  if (state.selected) await refreshDetail();
};

async function tick() {
  try {
    await loadWorkers();
    // Con SSE vivo el detalle se actualiza solo; el tick solo mantiene la
    // barra lateral y cubre el caso de que el stream no este disponible.
    if (state.selected && state.tab === "agent") await pollAgentOutput();
  } catch (e) { /* reintenta en el proximo tick */ }
}

// --- Atajos estilo vim -----------------------------------------------------
// Los mismos del TUI: j/k (o Ctrl+j/k) mueve entre workers, gg/G extremos,
// h/l cambia de pestana, i escribe al agente (esc vuelve al modo normal),
// s lanza agente, x x lo detiene, r refresca, v voz, ? ayuda.
function navIDs() {
  const principal = state.workers.filter(w => w.is_principal);
  const rest = state.workers.filter(w => !w.is_principal);
  return principal.concat(rest).map(w => w.id);
}

function moveSelection(delta) {
  const ids = navIDs();
  if (!ids.length) return;
  let idx = ids.indexOf(state.selected);
  idx = idx < 0 ? 0 : (idx + delta + ids.length) % ids.length;
  select(ids[idx]);
  const el = document.querySelector(`.worker[data-id="${CSS.escape(ids[idx])}"]`);
  if (el) el.scrollIntoView({ block: "nearest" });
}

const TAB_ORDER = ["agent", "services", "git"];
function cycleTab(delta) {
  if (!state.detail) return;
  state.tab = TAB_ORDER[(TAB_ORDER.indexOf(state.tab) + delta + TAB_ORDER.length) % TAB_ORDER.length];
  if (state.tab !== "agent") closeStream();
  renderMain();
}

let pendingG = false, pendingStop = 0;
document.addEventListener("keydown", e => {
  const el = document.activeElement;
  const typing = el && (el.tagName === "TEXTAREA" || el.tagName === "INPUT");
  if (typing) {
    // Modo insercion: solo Escape devuelve el modo normal.
    if (e.key === "Escape") el.blur();
    return;
  }
  if (e.ctrlKey && (e.key === "j" || e.key === "k")) {
    e.preventDefault();
    moveSelection(e.key === "j" ? 1 : -1);
    return;
  }
  if (e.ctrlKey || e.metaKey || e.altKey) return;

  const wasG = pendingG;
  pendingG = false;
  switch (e.key) {
    case "j": moveSelection(1); break;
    case "k": moveSelection(-1); break;
    case "g":
      if (wasG) { const ids = navIDs(); if (ids.length) select(ids[0]); }
      else pendingG = true;
      break;
    case "G": { const ids = navIDs(); if (ids.length) select(ids[ids.length - 1]); break; }
    case "h": case "[": cycleTab(-1); break;
    case "l": case "]": cycleTab(1); break;
    case "Enter": if (state.selected) refreshDetail(); break;
    case "r": document.getElementById("btn-refresh").click(); break;
    case "s": { const b = document.getElementById("a-start"); if (b) b.click(); break; }
    case "i": {
      const box = document.getElementById("a-msg");
      if (box) { e.preventDefault(); box.focus(); }
      break;
    }
    case "x": {
      const b = document.getElementById("a-stop");
      if (!b) break;
      if (Date.now() - pendingStop < 3000) { b.click(); pendingStop = 0; }
      else { pendingStop = Date.now(); toast("presiona [x] otra vez para detener el agente"); }
      break;
    }
    case "v": document.getElementById("tg-voz").click(); break;
    case "?":
      toast("j/k o C-j/k workers · gg/G extremos · h/l pestañas · i escribir (esc sale) · s lanzar · x x detener · r refrescar · v voz");
      break;
  }
});

loadVoice();
loadWorkers().catch(e => toast(e.message, true));
setInterval(tick, 3000);
setInterval(loadVoice, 30000);
</script>
